services:

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: masterai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: masterai_academy
      POSTGRES_USER: masterai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masterai -d masterai_academy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB (Semantic Memory do BrainAgent) ───────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: masterai_chromadb
    restart: unless-stopped
    environment:
      CHROMA_SERVER_AUTH_CREDENTIALS_PROVIDER: chromadb.auth.token.TokenConfigServerAuthCredentialsProvider
      CHROMA_SERVER_AUTH_TOKEN_TRANSPORT_HEADER: AUTHORIZATION
      CHROMA_SERVER_AUTH_CREDENTIALS: ${CHROMADB_TOKEN}
      # Mesmo valor para o healthcheck enviar Authorization: Bearer
      CHROMADB_BEARER: ${CHROMADB_TOKEN}
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    healthcheck:
      # Sem Bearer o Chroma responde 401 e o container fica "unhealthy"
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$CHROMADB_BEARER" ]; then curl -sf -H "Authorization: Bearer $$CHROMADB_BEARER" http://127.0.0.1:8000/api/v1/heartbeat; else curl -sf http://127.0.0.1:8000/api/v1/heartbeat; fi',
        ]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 25s

  # ── Redis (Working Memory do BrainAgent) ───────────────────
  redis:
    image: redis:7-alpine
    container_name: masterai_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend FastAPI ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: masterai_backend
    restart: unless-stopped
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama_cloud}
      OLLAMA_HOST: ${OLLAMA_HOST:-https://ollama.com}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:120b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      DATABASE_URL: postgresql://masterai:${POSTGRES_PASSWORD}@postgres:5432/masterai_academy
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
      CHROMADB_TOKEN: ${CHROMADB_TOKEN}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/content:/app/content:ro
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Frontend Next.js ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: masterai_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      # Target do rewrite em next.config.mjs (browser usa /api/backend → não precisa CORS para :8000)
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  chromadb_data:
  redis_data:

networks:
  default:
    name: masterai_network
